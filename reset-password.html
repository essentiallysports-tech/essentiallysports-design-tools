<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Saved dark theme, applied before paint. -->
  <script>try{if(localStorage.getItem('frameup.theme.v1')==='dark'){document.documentElement.dataset.theme='dark';document.documentElement.style.colorScheme='dark';}}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Reset your FrameUp password.">
  <title>Reset Password | FrameUp</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth-state.css?v=20261120-auth">
  <link rel="stylesheet" href="cta-hover.css?v=20261115-btn1">
  <link rel="stylesheet" href="design-tokens.css?v=20261117-ready1">
  <style>
    html { scrollbar-width: none; -ms-overflow-style: none; }
    html::-webkit-scrollbar { display: none; }
  </style>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js" as="script" integrity="sha384-UagCvVPT5XXA0Hx+nJYUAGBFseHT9zBgpJMSebsAxl9lciTwbT+39j5VfRjdP5Tp" crossorigin="anonymous">
  <script src="es-auth-config.js?v=20260714-authstate1"></script>
  <script src="es-auth.js?v=20261120-auth"></script>
  <script src="auth-flow.js?v=20261120-auth"></script>
</head>
<body class="auth-state-page">
  <main class="auth-state-card" aria-live="polite">
    <img class="auth-state-brand" src="brand-logo-blue.svg" alt="EssentiallySports">
    <div class="auth-state-icon" id="reset-icon" aria-hidden="true"><span class="auth-state-spinner"></span></div>
    <h1 class="auth-state-title" id="reset-title" tabindex="-1">Reset password</h1>
    <p class="auth-state-copy" id="reset-intro">Confirming your secure recovery link…</p>

    <form class="auth-state-form" id="reset-form" hidden novalidate>
      <label class="auth-state-field">
        New password
        <span class="auth-state-input-wrap">
          <input class="auth-state-input" id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required aria-describedby="reset-rules">
          <button class="auth-state-password-toggle" type="button" data-password-toggle="new-password" aria-label="Show new password"></button>
        </span>
      </label>
      <ul class="auth-state-rules" id="reset-rules" aria-live="polite"></ul>
      <label class="auth-state-field">
        Confirm new password
        <span class="auth-state-input-wrap">
          <input class="auth-state-input" id="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
          <button class="auth-state-password-toggle" type="button" data-password-toggle="confirm-password" aria-label="Show confirmed password"></button>
        </span>
      </label>
      <button class="auth-state-button is-primary" id="reset-button" type="submit">Update password</button>
    </form>

    <form class="auth-state-form" id="new-link-form" hidden novalidate>
      <label class="auth-state-field" for="new-link-email">
        Your email
        <input class="auth-state-input" id="new-link-email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" placeholder="you@essentiallysports.com" required>
      </label>
      <button class="auth-state-button is-primary" id="new-link-button" type="submit">Email me a new reset link</button>
      <p class="auth-state-help" id="new-link-help"></p>
    </form>

    <p class="auth-state-status" id="reset-status" role="status" aria-live="polite"></p>
    <div class="auth-state-actions" id="reset-actions" hidden>
      <a class="auth-state-button" id="login-link" href="login.html">Return to login</a>
    </div>
  </main>

  <script>
    (() => {
      const form = document.getElementById('reset-form');
      const icon = document.getElementById('reset-icon');
      const intro = document.getElementById('reset-intro');
      const passwordInput = document.getElementById('new-password');
      const confirmInput = document.getElementById('confirm-password');
      const button = document.getElementById('reset-button');
      const status = document.getElementById('reset-status');
      const actions = document.getElementById('reset-actions');
      const loginLink = document.getElementById('login-link');
      const resetTitle = document.getElementById('reset-title');
      const rulesList = document.getElementById('reset-rules');
      const newLinkForm = document.getElementById('new-link-form');
      const newLinkEmail = document.getElementById('new-link-email');
      const newLinkButton = document.getElementById('new-link-button');
      const newLinkHelp = document.getElementById('new-link-help');
      const Flow = window.FrameUpAuthFlow;
      const pageMode = new URLSearchParams(window.location.search).get('mode') || 'reset';
      const isInvite = pageMode === 'invite';
      let newLinkTimer = null;

      function renderRules() {
        if (!Flow || !window.ESAuth?.passwordChecks) return;
        const rules = Flow.passwordRules(window.ESAuth.passwordChecks(passwordInput.value));
        rulesList.replaceChildren(...rules.map(rule => {
          const item = document.createElement('li');
          item.className = rule.met ? 'is-met' : '';
          item.textContent = `${rule.label}${rule.met ? ' (done)' : ''}`;
          return item;
        }));
      }

      function newLinkCooldown(seconds) {
        if (newLinkTimer) window.clearInterval(newLinkTimer);
        let remaining = Math.max(0, Math.ceil(seconds || 0));
        const tick = () => {
          if (remaining <= 0) {
            window.clearInterval(newLinkTimer);
            newLinkTimer = null;
            newLinkButton.disabled = false;
            newLinkButton.textContent = 'Email me a new reset link';
            return;
          }
          newLinkButton.disabled = true;
          newLinkButton.textContent = `Send again in ${Flow ? Flow.formatCountdown(remaining) : `${remaining}s`}`;
          remaining -= 1;
        };
        tick();
        if (newLinkButton.disabled) newLinkTimer = window.setInterval(tick, 1000);
      }
      const successIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
      const errorIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>';
      const eyeIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>';
      const eyeOffIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>';

      function showStatus(message, success = false) {
        status.textContent = message || '';
        status.classList.toggle('is-success', success);
        status.classList.toggle('is-error', Boolean(message) && !success);
      }

      function showErrorState(message) {
        document.title = 'Password reset link issue | FrameUp';
        icon.innerHTML = errorIcon;
        icon.classList.add('is-error');
        intro.textContent = 'This password recovery link is invalid or has expired.';
        const normalizedMessage = String(message || '').toLowerCase();
        const recoveryMessage = (
          normalizedMessage.includes('confirmation link')
          || normalizedMessage.includes('confirm this email')
        )
          ? ''
          : String(message || '').trim();
        showStatus(recoveryMessage || 'Request a new password reset link from the FrameUp login page.');
        // Ask for a fresh link right here instead of a dead end.
        newLinkForm.hidden = false;
        newLinkHelp.textContent = Flow ? Flow.SPAM_HELP : '';
        actions.hidden = false;
        resetTitle.focus({ preventScroll: true });
      }

      newLinkForm.addEventListener('submit', async event => {
        event.preventDefault();
        const email = newLinkEmail.value.trim();
        if (!newLinkEmail.validity.valid || !email) {
          showStatus('Enter the email you use for FrameUp.');
          newLinkEmail.focus();
          return;
        }
        newLinkButton.disabled = true;
        newLinkButton.setAttribute('aria-busy', 'true');
        newLinkButton.textContent = 'Sending…';
        try {
          await window.ESAuth.requestPasswordReset({ email, redirectTo: new URL('reset-password.html', window.location.href).href });
          showStatus(`If ${email.toLowerCase()} has a FrameUp account, a new reset link is on its way.`, true);
          newLinkCooldown(window.ESAuth.emailCooldownRemaining?.(email) || 60);
        } catch (error) {
          const outcome = Flow ? Flow.outcomeForError(error) : { message: error?.message, cooldown: 0 };
          showStatus(outcome.message || 'Unable to send the password reset email.');
          if (outcome.cooldown) newLinkCooldown(outcome.cooldown);
          else { newLinkButton.disabled = false; newLinkButton.textContent = 'Email me a new reset link'; }
        } finally {
          newLinkButton.setAttribute('aria-busy', 'false');
        }
      });

      function initializePasswordToggles() {
        document.querySelectorAll('[data-password-toggle]').forEach(toggle => {
          const input = document.getElementById(toggle.dataset.passwordToggle);
          if (!input) return;
          toggle.innerHTML = eyeIcon;
          toggle.addEventListener('click', () => {
            const shouldShow = input.type === 'password';
            input.type = shouldShow ? 'text' : 'password';
            toggle.innerHTML = shouldShow ? eyeOffIcon : eyeIcon;
            toggle.setAttribute('aria-label', shouldShow ? 'Hide password' : 'Show password');
            input.focus();
          });
        });
      }

      async function boot() {
        try {
          const session = await window.ESAuth?.completeAuthCallback?.();
          if (!session?.token) {
            showErrorState();
            return;
          }

          window.history.replaceState({}, document.title, window.location.pathname);
          icon.innerHTML = successIcon;
          icon.classList.add('is-success');
          if (isInvite) {
            resetTitle.textContent = 'Set your password';
            document.title = 'Set your password | FrameUp';
            button.textContent = 'Save password';
          }
          intro.textContent = isInvite
            ? 'Choose a password for your FrameUp account. You’ll use it with your email to log in.'
            : 'Choose a new password with at least 8 characters.';
          renderRules();
          form.hidden = false;
          passwordInput.focus();
        } catch (error) {
          showErrorState(error?.message || 'Unable to validate this recovery link. Request a new link and try again.');
        }
      }

      form.addEventListener('submit', async event => {
        event.preventDefault();
        showStatus('');

        const password = passwordInput.value;
        if (password.length < 8) {
          showStatus('Password must be at least 8 characters.');
          passwordInput.focus();
          return;
        }
        if (Flow && window.ESAuth?.passwordChecks && !Flow.passwordOk(window.ESAuth.passwordChecks(password))) {
          const unmet = Flow.passwordRules(window.ESAuth.passwordChecks(password)).find(rule => !rule.met);
          showStatus(`Password: ${unmet ? unmet.label.toLowerCase() : 'check the rules above'}.`);
          passwordInput.focus();
          return;
        }
        if (password !== confirmInput.value) {
          showStatus('Passwords do not match.');
          confirmInput.focus();
          return;
        }

        button.disabled = true;
        button.textContent = 'Updating…';
        try {
          await window.ESAuth.updatePassword(password);
          await window.ESAuth.logout();
          form.hidden = true;
          intro.textContent = 'Your password has been updated.';
          showStatus('You can now log in with your new password.', true);
          loginLink.href = 'login.html?mode=login&password=updated';
          loginLink.textContent = 'Log in';
          loginLink.classList.add('is-primary');
          actions.hidden = false;
          loginLink.focus();
        } catch (error) {
          showStatus(error.message || 'Unable to update the password.');
          button.disabled = false;
          button.textContent = 'Update password';
        }
      });

      passwordInput.addEventListener('input', renderRules);
      initializePasswordToggles();
      boot();
    })();
  </script>
</body>
</html>
