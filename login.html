<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Log in to FrameUp.">
<title>Log in | FrameUp</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@700;800&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js" as="script">
  <script src="es-auth-config.js?v=20260714-authcallback1"></script>
  <script src="es-auth.js?v=20261025-perf1"></script>
<style>
  @font-face {
    font-family: 'Acumin Pro Condensed Local';
    src: url('fonts/acumin-pro-condensed-bold.otf') format('opentype');
    font-style: normal;
    font-weight: 700;
    font-display: swap;
  }
  :root {
    --white: #FFFFFF;
    --bg-page: var(--es-sunk);
    --text-primary: var(--es-ink);
    --text-blue: var(--es-ink);
    --text-muted: var(--es-ink-3);
    --accent: var(--es-brand-fill);
    --accent-hover: var(--es-brand-fill-press);
    --border: var(--es-line);
    --border-soft: var(--es-line);
    --font-ui:  var(--es-font-ui);
    --font-heading:  var(--es-font-display);
    --font-title:  var(--es-font-display);
    --shadow-soft: 0 20px 60px rgba(3, 49, 98, 0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    background: var(--bg-page);
    color: var(--text-primary);
    font-family: var(--font-ui);
    overflow-x: clip;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .28s var(--es-ease), transform .28s var(--es-ease);
  }
  body.is-page-ready {
    opacity: 1;
    transform: translateY(0);
  }
  body.is-page-leaving {
    opacity: 0;
    transform: translateY(8px);
  }
  @media (prefers-reduced-motion: reduce) {
    body,
    body.is-page-ready,
    body.is-page-leaving {
      opacity: 1;
      transform: none;
      transition: none;
    }
  }
  a { color: inherit; }
  [hidden] { display: none !important; }
  .login-shell {
    width: min(1040px, calc(100% - 80px));
    min-height: 520px;
    margin: 0 auto;
    padding: 78px 0 112px;
    display: grid;
    grid-template-columns: 1fr;
    align-items: center;
  }
  .login-panel {
    width: 100%;
    max-width: 960px;
    padding: clamp(26px, 3vw, 38px);
    min-height: 560px;
    border: 1px solid var(--es-line);
    border-radius: 20px;
    background: rgba(255, 255, 255, .94);
    box-shadow: 0 22px 60px rgba(14, 16, 20, .08);
    overflow: hidden;
    display: grid;
    grid-template-columns: minmax(240px, 330px) minmax(360px, 1fr);
    align-items: center;
    gap: clamp(38px, 5vw, 76px);
  }
  .login-copy {
    min-width: 0;
  }
  .login-brand {
    display: block;
    width: min(260px, 86%);
    height: auto;
    margin: 0 0 22px;
  }
  .login-title {
    display: block;
    color: #000000;
    font-family: var(--font-title);
    font-size: clamp(34px, 4vw, 52px);
    font-weight: 800;
    letter-spacing: -0.045em;
    line-height: .95;
    max-width: 100%;
    overflow-wrap: normal;
    text-wrap: balance;
  }
  .login-form {
    min-width: 0;
    min-height: 410px;
    margin-top: 0;
    display: grid;
    gap: 18px;
    align-content: center;
    transition: opacity .28s var(--es-ease), transform .28s var(--es-ease);
  }
  .login-form.is-switching {
    opacity: .72;
    transform: translateY(3px);
  }
  .login-mode-tabs {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    padding: 5px;
    border: 1px solid var(--es-line);
    border-radius: 14px;
    background: var(--es-stage);
  }
  .login-mode-tab {
    min-height: 42px;
    border: 0;
    border-radius: 14px;
    background: transparent;
    color: var(--text-blue);
    cursor: pointer;
    font-family: var(--es-font-ui);
    font-size: 16px;
    font-weight: 700;
    transition: background-color .26s var(--es-ease), color .26s var(--es-ease), box-shadow .26s var(--es-ease), transform .26s var(--es-ease);
  }
  .login-mode-tab.is-active {
    background: var(--white);
    color: #000000;
    box-shadow: 0 10px 28px rgba(14, 16, 20, .08);
    transform: translateY(-1px);
  }
  .login-mode-tab:focus-visible {
    outline: 2px solid rgba(10, 125, 250, .28);
    outline-offset: 2px;
  }
  .login-field {
    display: grid;
    gap: 12px;
    transition: opacity .26s var(--es-ease), transform .26s var(--es-ease);
  }
  .login-field label {
    color: #000000;
    font-size: 18px;
    font-weight: 400;
    line-height: 1;
  }
  .login-field input {
    width: 100%;
    height: 56px;
    border: 0;
    border-radius: 14px;
    background: var(--white);
    color: var(--es-ink);
    font-family: var(--es-font-ui);
    font-size: 18px;
    font-weight: 400;
    line-height: 1;
    padding: 0 16px;
    outline: none;
    box-shadow: inset 0 0 0 1.5px var(--es-line-2);
    transition: box-shadow .16s var(--es-ease);
  }
  .login-field input:hover {
    box-shadow: inset 0 0 0 1.5px var(--es-ink-3);
  }
  .login-field input::placeholder {
    color: var(--es-placeholder);
  }
  .login-field input:focus {
    box-shadow: inset 0 0 0 2px var(--es-ink), 0 0 0 4px rgba(14, 16, 20, .08);
  }
  .login-button {
    width: 100%;
    height: 56px;
    border: 0;
    border-radius: 14px;
    background: var(--es-brand-fill);
    color: var(--white);
    font-family: var(--font-heading);
    font-size: clamp(14px, .78vw, 16px);
    font-weight: 500;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 12px 24px rgba(14, 16, 20, 0.18);
    transition: transform .16s var(--es-ease), box-shadow .16s var(--es-ease), background-color .16s var(--es-ease);
  }
  .login-button:hover,
  .login-button:focus-visible {
    background: var(--es-ink);
    transform: translateY(-2px);
    box-shadow: 0 16px 28px rgba(14, 16, 20, 0.24);
    outline: none;
  }
  .login-button:active {
    transform: translateY(1px);
  }
  .login-button[disabled] {
    cursor: wait;
    opacity: .78;
  }
  .login-forgot {
    justify-self: end;
    margin-top: -8px;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--text-blue);
    font: 500 13px/1.3 var(--font-ui);
    cursor: pointer;
  }
  .login-forgot:hover,
  .login-forgot:focus-visible {
    color: var(--accent);
    text-decoration: underline;
    outline: none;
  }
  .login-forgot[disabled] {
    cursor: wait;
    opacity: .6;
  }
  .login-note,
  .login-error {
    min-height: 18px;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.35;
  }
  .login-note { color: var(--es-ink-3); }
  .login-note strong { color: var(--text-blue); }
  .login-error {
    display: none;
    color: var(--es-bad);
  }
  .login-error.is-success {
    color: var(--es-good);
  }
  .login-error.is-visible {
    display: block;
  }
  .login-confirmation {
    min-width: 0;
    min-height: 410px;
    display: grid;
    align-content: center;
    justify-items: start;
  }
  .login-confirmation-icon {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    margin-bottom: 20px;
    border-radius: 50%;
    background: var(--es-brand-soft);
    color: var(--accent);
  }
  .login-confirmation-icon svg {
    width: 22px;
    height: 22px;
  }
  .login-confirmation h2 {
    margin: 0;
    color: #000;
    font-family: var(--font-title);
    font-size: clamp(34px, 4vw, 46px);
    font-weight: 700;
    letter-spacing: -.035em;
    line-height: .98;
  }
  .login-confirmation p {
    max-width: 480px;
    margin: 16px 0 0;
    color: var(--es-ink-3);
    font-size: 16px;
    font-weight: 400;
    line-height: 1.5;
  }
  .login-confirmation strong {
    color: var(--es-ink);
    font-weight: 700;
    overflow-wrap: anywhere;
  }
  .login-confirmation-actions {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-top: 26px;
  }
  .login-secondary-button {
    min-height: 44px;
    border: 1px solid var(--es-line-2);
    border-radius: 14px;
    background: #FFFFFF;
    color: var(--es-ink);
    font: 500 clamp(14px, .78vw, 16px)/1 var(--font-heading);
    cursor: pointer;
  }
  .login-secondary-button:hover,
  .login-secondary-button:focus-visible {
    border-color: var(--es-ink-3);
    outline: none;
  }
  .login-secondary-button[disabled] {
    cursor: wait;
    opacity: .65;
  }
  .login-confirmation-status {
    min-height: 18px;
    margin-top: 14px;
    color: var(--es-good);
    font-size: 15px;
    font-weight: 500;
    line-height: 1.35;
  }
  .login-showcase {
    width: min(1280px, calc(100% - 80px));
    margin: 0 auto;
    padding: 0 0 260px;
    display: block;
  }
  .showcase-heading {
    max-width: 720px;
    margin-bottom: 48px;
  }
  .showcase-eyebrow {
    color: var(--accent);
    font-family: var(--es-font-ui);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .showcase-heading h2 {
    margin-top: 12px;
    color: #000000;
    font-family: var(--font-title);
    font-size: clamp(38px, 4.2vw, 62px);
    font-weight: 700;
    letter-spacing: -.035em;
    line-height: .98;
  }
  .showcase-heading p {
    max-width: 640px;
    margin-top: 20px;
    color: var(--es-ink-2);
    font-size: clamp(16px, 1.35vw, 19px);
    font-weight: 400;
    line-height: 1.55;
  }
  .login-feature-card {
    position: sticky;
    top: 86px;
    align-self: start;
    height: min(620px, calc(100vh - 150px));
    min-height: 520px;
    display: grid;
    grid-template-columns: minmax(280px, .8fr) minmax(480px, 1.2fr);
    align-items: center;
    gap: clamp(48px, 7vw, 104px);
    overflow: hidden;
    border: 1px solid rgba(181, 216, 253, .72);
    border-radius: 34px;
    background: #FFFFFF;
    box-shadow: 0 28px 84px rgba(14, 16, 20, .12);
    padding: clamp(44px, 5vw, 76px);
    transform-origin: top center;
  }
  .login-feature-card + .login-feature-card {
    margin-top: 34px;
  }
  .login-showcase > .login-feature-card:nth-of-type(1) {
    z-index: 1;
    top: 86px;
  }
  .login-showcase > .login-feature-card:nth-of-type(2) {
    z-index: 2;
    top: 106px;
  }
  .login-showcase > .login-feature-card:nth-of-type(3) {
    z-index: 3;
    top: 126px;
  }
  .login-feature-card.is-reversed {
    grid-template-columns: minmax(480px, 1.2fr) minmax(280px, .8fr);
  }
  .login-feature-card.is-reversed .feature-copy {
    order: 2;
  }
  .login-feature-card.is-reversed .feature-visual {
    order: 1;
  }
  .feature-copy {
    align-self: center;
  }
  .feature-index {
    color: var(--accent);
    font-family: var(--es-font-ui);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .feature-copy h3 {
    margin-top: 14px;
    color: var(--es-ink);
    font-family: var(--font-title);
    font-size: clamp(36px, 3.6vw, 54px);
    font-weight: 700;
    letter-spacing: -.035em;
    line-height: 1;
  }
  .feature-copy p {
    margin-top: 20px;
    color: var(--es-ink-2);
    font-size: clamp(16px, 1.2vw, 18px);
    font-weight: 400;
    line-height: 1.58;
  }
  .feature-tags {
    margin-top: 28px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .feature-tags span {
    min-height: 34px;
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--es-sunk);
    color: var(--text-blue);
    padding: 0 14px;
    font-size: 15px;
    font-weight: 500;
  }
  .feature-visual {
    min-width: 0;
    min-height: 0;
    display: grid;
    place-items: center;
    overflow: visible;
    border-radius: 0;
    background: transparent;
    padding: 0;
  }
  .feature-visual img {
    display: block;
    width: min(100%, 650px);
    height: auto;
    max-height: min(500px, calc(100vh - 260px));
    object-fit: contain;
  }
  .selection-box {
    position: absolute;
    left: 62px;
    top: 70px;
    width: min(640px, 100%);
    height: 252px;
    border: 1.5px solid var(--es-brand-tint);
    border-left: 0;
    pointer-events: none;
  }
  .selection-box::before,
  .selection-box::after {
    content: "";
    position: absolute;
    width: 9px;
    height: 9px;
    border: 1.5px solid var(--es-brand-tint);
    background: var(--bg-page);
  }
  .selection-box::before { right: -5px; top: -5px; }
  .selection-box::after { right: -5px; bottom: -5px; }
  .selection-corner {
    position: absolute;
    width: 9px;
    height: 9px;
    border: 1.5px solid var(--es-brand-tint);
    background: var(--bg-page);
  }
  .selection-corner.is-top { left: 138px; top: -5px; }
  .selection-corner.is-bottom { left: 0; bottom: -5px; }
  .selection-elbow {
    position: absolute;
    left: -4px;
    top: 31px;
    width: 48px;
    height: 46px;
    border-left: 1.5px solid var(--es-brand-tint);
    border-top: 1.5px solid var(--es-brand-tint);
  }
  .selection-caption {
    position: absolute;
    right: 220px;
    bottom: -44px;
    min-width: 206px;
    height: 38px;
    border-left: 1.5px solid var(--es-brand-tint);
    border-top: 1.5px solid var(--es-brand-tint);
    border-bottom: 1.5px solid var(--es-brand-tint);
    color: var(--es-ink);
    background: rgba(246, 251, 255, .62);
    font-size: 22px;
    font-weight: 800;
    line-height: 35px;
    padding-left: 10px;
  }
  .selection-caption::after {
    content: "";
    position: absolute;
    right: -74px;
    top: -1.5px;
    width: 74px;
    height: 38px;
    border-top: 1.5px solid var(--es-brand-tint);
  }
  .doc-chip {
    position: absolute;
    left: 128px;
    top: 88px;
    width: 88px;
    height: 76px;
    color: var(--text-blue);
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.04em;
  }
  .doc-chip::before {
    content: "";
    position: absolute;
    right: 0;
    top: 20px;
    width: 62px;
    height: 72px;
    border: 1.5px solid var(--es-brand-tint);
    border-radius: 14px;
    background: linear-gradient(135deg, transparent 0 19px, var(--es-brand-soft) 20px), #FFFFFF;
    box-shadow: 0 12px 30px rgba(14, 16, 20, .08);
  }
  .doc-chip::after {
    content: "";
    position: absolute;
    right: 10px;
    top: 50px;
    width: 34px;
    height: 8px;
    border-radius: 2px;
    background: var(--es-line);
    box-shadow: 0 18px 0 var(--es-line);
  }
  .doc-chip span {
    position: relative;
    z-index: 1;
  }
  .mini-playbook {
    position: absolute;
    left: 28px;
    top: 196px;
    width: 250px;
    height: 124px;
    border-radius: 4px;
    background: #FFFFFF;
    border: 1px solid #E4EDF7;
    box-shadow: var(--shadow-soft);
    overflow: hidden;
    padding: 12px 14px;
  }
  .mini-playbook::before {
    content: "PRO PLAYBOOK";
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 18px;
    padding: 0 8px;
    background: var(--es-good);
    color: #FFFFFF;
    font-size: 12px;
    font-weight: 800;
  }
  .mini-playbook-title {
    margin-top: 7px;
    color: var(--text-blue);
    font-size: 12px;
    font-weight: 800;
    line-height: 1.2;
    max-width: 202px;
  }
  .mini-playbook-body {
    display: grid;
    grid-template-columns: 58px 1fr;
    gap: 10px;
    align-items: end;
    margin-top: 9px;
  }
  .mini-playbook-thumb {
    width: 58px;
    height: 55px;
    border: 1px solid var(--es-line);
    background: url("workspace-card-social-media.webp") center / cover no-repeat;
  }
  .mini-playbook-copy strong {
    display: block;
    color: var(--text-blue);
    font-size: 13px;
    line-height: 1.05;
  }
  .mini-playbook-copy span {
    display: block;
    margin-top: 4px;
    color: var(--es-ink-3);
    font-size: 12px;
    line-height: 1.25;
  }
  .mini-playbook-button {
    display: block;
    height: 18px;
    margin-top: 8px;
    border-radius: 2px;
    background: #09643D;
    color: #FFFFFF;
    font-size: 12px;
    font-weight: 800;
    text-align: center;
    line-height: 18px;
  }
  .text-design-card {
    position: absolute;
    left: 260px;
    top: 115px;
    width: 380px;
    height: 216px;
    border-radius: 20px;
    background: rgba(255,255,255,.94);
    box-shadow: var(--shadow-soft);
    overflow: hidden;
  }
  .text-design-card h2 {
    height: 62px;
    display: flex;
    align-items: center;
    padding-left: 34px;
    color: #000000;
    font-size: 22px;
    font-weight: 800;
  }
  .text-design-field {
    height: 58px;
    margin: 0 0 24px 34px;
    border: 1.5px solid var(--es-brand-tint);
    border-right: 0;
    border-radius: 14px 0 0 14px;
    display: flex;
    align-items: center;
    padding-left: 24px;
    color: var(--text-blue);
    font-size: 22px;
    font-weight: 800;
  }
  .design-card-actions {
    display: flex;
    gap: 18px;
    padding-left: 34px;
  }
  .ghost-upload,
  .ghost-export {
    height: 40px;
    border-radius: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 800;
  }
  .ghost-upload {
    width: 116px;
    background: #FFFFFF;
    color: #000000;
    border: 1px solid var(--es-brand-soft);
  }
  .ghost-export {
    width: 112px;
    background: var(--accent);
    color: #FFFFFF;
  }
  .login-footer {
    margin-top: auto;
    background: var(--white);
    color: var(--es-ink);
    font-weight: 700;
  }
  .footer-hero {
    background: var(--accent);
    color: var(--white);
    text-align: center;
    padding: 74px 24px 28px;
  }
  .footer-logo-img {
    display: block;
    width: auto;
    max-width: min(100%, 820px);
    height: clamp(30px, 6vw, 48px);
    margin: 0 auto;
  }
  .footer-blurb {
    width: min(980px, 100%);
    margin: 18px auto 22px;
    font-size: 15px;
    font-weight: 400;
    line-height: 18px;
  }
  .footer-socials {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 14px;
  }
  .footer-socials a,
  .footer-col a,
  .footer-bottom a,
  .footer-logo-link {
    color: inherit;
    text-decoration: none;
  }
  .footer-socials img {
    display: block;
    width: 24px;
    height: 24px;
  }
  .footer-copy {
    font-size: 15px;
    font-weight: 700;
  }
  .footer-links {
    width: min(1200px, calc(100% - 48px));
    margin: 0 auto;
    padding: 34px 0 44px;
    display: grid;
    grid-template-columns: 1.1fr 1.1fr 1.1fr 1.4fr;
    gap: 44px;
  }
  .footer-col {
    display: flex;
    flex-direction: column;
    gap: 17px;
    font-size: 15px;
    font-weight: 500;
  }
  .footer-col span {
    font-size: 16px;
    font-weight: 800;
  }
  .footer-col.sports {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: 36px;
    row-gap: 17px;
  }
  .footer-bottom {
    width: min(1200px, calc(100% - 48px));
    margin: 0 auto;
    border-top: 1px solid var(--border);
    padding: 20px 0 24px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 22px;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 500;
  }
  @media (max-width: 1280px) {
    .footer-links {
      grid-template-columns: repeat(2, minmax(0, 1fr));

  }
  @media (max-width: 960px) {

      width: min(720px, calc(100% - 40px));

    }

      max-width: 560px;

    .selection-box {

    }
    .footer-links {
      grid-template-columns: repeat(2, minmax(0, 1fr));

    }
    .login-showcase {
      width: min(720px, calc(100% - 40px));
      padding-bottom: 110px;
    }
    .login-feature-card,
    .login-feature-card.is-reversed {
      position: relative;
      top: auto !important;
      min-height: 0;
      grid-template-columns: 1fr;
      gap: 36px;
    }
    .login-feature-card.is-reversed .feature-copy,
    .login-feature-card.is-reversed .feature-visual {
      order: initial;
    }
    .feature-visual {
      min-height: 430px;

  }
  @media (max-width: 680px) {
    .login-shell {
      width: calc(100% - 32px);
      min-height: 0;
      padding: 38px 0 78px;
    }
    .login-title {
      font-size: 36px;
    }
    .footer-logo-img {
      height: 34px;
    }
    .footer-hero {
      padding: 50px 18px 24px;
    }
    .footer-links {
      width: calc(100% - 36px);
      padding: 28px 0 34px;

      gap: 24px;
    }
    .footer-bottom {
      width: calc(100% - 36px);
      flex-direction: column;
      align-items: flex-start;

    .login-showcase {

      padding-bottom: 80px;

    .login-feature-card,
    .login-feature-card.is-reversed {

</style>
<link rel="stylesheet" href="site-mobile-chrome.css?v=20261022-es1">
<link rel="stylesheet" href="theme.css?v=20261023-ux1">
  <link rel="stylesheet" href="site-chrome.css?v=20261023-ux1">
<link rel="stylesheet" href="cta-hover.css?v=20261022-es1">
<link rel="stylesheet" href="design-tokens.css?v=20261023-type1">
<script src="theme.js?v=20260712-darkmode12"></script>
<script src="site-mobile-chrome.js?v=20260723-profile2"></script>
<script src="site-chrome.js?v=20261024-live1"></script>
</head>
<body>
<main class="login-shell">
  <section class="login-panel" aria-labelledby="login-title">
    <div class="login-copy">
      <img class="login-brand" src="brand-logo-blue.svg" alt="EssentiallySports">
      <h1 class="login-title" id="login-title">Log in to FrameUp</h1>
    </div>
    <form class="login-form" id="login-form" novalidate>
      <div class="login-mode-tabs" role="tablist" aria-label="Authentication mode">
        <button class="login-mode-tab is-active" id="login-account-tab" type="button" data-auth-mode="login" role="tab" aria-selected="true">Login</button>
        <button class="login-mode-tab" id="create-account-tab" type="button" data-auth-mode="create" role="tab" aria-selected="false">Create account</button>
      </div>
      <div class="login-field">
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" autocomplete="email" placeholder="xyz@email.com" required>
      </div>
      <div class="login-field">
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
      </div>
      <button class="login-forgot" id="forgot-password" type="button" data-login-only>Forgot password?</button>
      <button class="login-button" type="submit">Login</button>
      <p class="login-error" id="login-error" role="alert"></p>
      <p class="login-note" id="login-note">Login with the email and password you created for FrameUp.</p>
    </form>
    <section class="login-confirmation" id="login-confirmation" tabindex="-1" aria-live="polite" hidden>
      <div class="login-confirmation-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 6.5h16v11H4v-11Zm.5.5 7.5 6L19.5 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2>Check your inbox</h2>
      <p>We sent a secure confirmation link to <strong id="confirmation-email"></strong>. Click it once to activate your account—there is no code to enter.</p>
      <div class="login-confirmation-actions">
        <button class="login-secondary-button" id="back-to-login" type="button">Back to login</button>
        <button class="login-secondary-button" id="resend-confirmation" type="button">Resend link</button>
      </div>
      <p class="login-confirmation-status" id="confirmation-status" role="status"></p>
    </section>
  </section>
</main>

<script>
(() => {
  const form = document.getElementById('login-form');
  const title = document.getElementById('login-title');
  const modeTabs = Array.from(document.querySelectorAll('[data-auth-mode]'));
  const loginOnlyFields = Array.from(document.querySelectorAll('[data-login-only]'));
  const emailInput = document.getElementById('login-email');
  const passwordInput = document.getElementById('login-password');
  const forgotPasswordButton = document.getElementById('forgot-password');
  const errorEl = document.getElementById('login-error');
  const noteEl = document.getElementById('login-note');
  const button = form.querySelector('.login-button');
  const confirmationPanel = document.getElementById('login-confirmation');
  const confirmationEmail = document.getElementById('confirmation-email');
  const confirmationStatus = document.getElementById('confirmation-status');
  const backToLoginButton = document.getElementById('back-to-login');
  const resendConfirmationButton = document.getElementById('resend-confirmation');
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const defaultRedirectTarget = 'index.html';
  let authMode = 'login';
  let pendingConfirmationEmail = '';

  function showPage() {
    document.body.classList.remove('is-page-leaving');
    document.body.classList.add('is-page-ready');
  }

  window.requestAnimationFrame(showPage);
  window.addEventListener('pageshow', showPage);

  function setError(message, type = 'error') {
    errorEl.textContent = message || '';
    errorEl.classList.toggle('is-visible', Boolean(message));
    errorEl.classList.toggle('is-success', type === 'success' && Boolean(message));
  }

  function setMode(mode) {
    authMode = mode === 'login' ? 'login' : 'create';
    const isCreate = authMode === 'create';
    form.hidden = false;
    confirmationPanel.hidden = true;
    form.classList.add('is-switching');
    window.setTimeout(() => form.classList.remove('is-switching'), 180);
    title.textContent = isCreate ? 'Create your FrameUp account' : 'Log in to FrameUp';
    button.textContent = isCreate ? 'Create Account' : 'Login';
    passwordInput.autocomplete = isCreate ? 'new-password' : 'current-password';
    passwordInput.placeholder = isCreate ? 'Minimum 8 characters' : 'Password';
    noteEl.innerHTML = isCreate
      ? '<strong>Create your account.</strong> We will email a secure confirmation link. No OTP or code is required.'
      : '<strong>Already signed up?</strong> Log in with your approved email and password.';
    loginOnlyFields.forEach(field => {
      field.hidden = isCreate;
    });
    modeTabs.forEach(tab => {
      const active = tab.dataset.authMode === authMode;
      tab.classList.toggle('is-active', active);
      tab.setAttribute('aria-selected', String(active));
    });
    setError('');
  }

  function showConfirmation(email) {
    pendingConfirmationEmail = email;
    confirmationEmail.textContent = email;
    confirmationStatus.textContent = '';
    form.hidden = true;
    confirmationPanel.hidden = false;
    title.textContent = 'Confirm your email';
    confirmationPanel.focus?.();
  }

  function getRedirectTarget() {
    const params = new URLSearchParams(window.location.search);
    const rawTarget = params.get('redirect') || defaultRedirectTarget;
    try {
      const url = new URL(rawTarget, window.location.href);
      if (url.origin !== window.location.origin) return defaultRedirectTarget;
      if (/\/login\.html$/i.test(url.pathname)) return defaultRedirectTarget;
      const path = url.pathname.replace(/^\//, '') || defaultRedirectTarget;
      return `${path}${url.search}${url.hash}`;
    } catch (error) {
      return defaultRedirectTarget;
    }
  }

  function validateEmail(email) {
    if (!emailInput.validity.valid || !email) {
      setError('Enter a valid email address.');
      emailInput.focus();
      return false;
    }
    return true;
  }

  function validateBaseFields(email, password) {
    if (!validateEmail(email)) return false;
    if (!password) {
      setError('Enter your password.');
      passwordInput.focus();
      return false;
    }
    return true;
  }

  function goToApp() {
    const redirectTarget = getRedirectTarget();
    if (prefersReducedMotion) {
      window.location.href = redirectTarget;
      return;
    }
    document.body.classList.remove('is-page-ready');
    document.body.classList.add('is-page-leaving');
    window.setTimeout(() => {
      window.location.href = redirectTarget;
    }, 220);
  }

  modeTabs.forEach(tab => {
    tab.addEventListener('click', () => setMode(tab.dataset.authMode));
  });

  backToLoginButton.addEventListener('click', () => {
    setMode('login');
    emailInput.value = pendingConfirmationEmail;
    passwordInput.value = '';
    emailInput.focus();
  });

  resendConfirmationButton.addEventListener('click', async () => {
    if (!pendingConfirmationEmail) return;
    confirmationStatus.textContent = '';
    resendConfirmationButton.disabled = true;
    resendConfirmationButton.textContent = 'Sending…';
    try {
      await window.ESAuth.resendConfirmation({
        email: pendingConfirmationEmail,
        redirectTo: getRedirectTarget(),
      });
      confirmationStatus.textContent = 'A fresh confirmation link has been sent.';
    } catch (error) {
      confirmationStatus.textContent = error.message || 'Unable to resend the confirmation link.';
    } finally {
      resendConfirmationButton.disabled = false;
      resendConfirmationButton.textContent = 'Resend link';
    }
  });

  forgotPasswordButton.addEventListener('click', async () => {
    setError('');
    const email = emailInput.value.trim();
    if (!validateEmail(email)) return;

    forgotPasswordButton.disabled = true;
    forgotPasswordButton.textContent = 'Sending reset link...';
    try {
      const redirectTo = new URL('reset-password.html', window.location.href).href;
      await window.ESAuth.requestPasswordReset({ email, redirectTo });
      setError('If an account exists for this email, a password reset link has been sent.', 'success');
    } catch (error) {
      setError(error.message || 'Unable to send the password reset email.');
    } finally {
      forgotPasswordButton.disabled = false;
      forgotPasswordButton.textContent = 'Forgot password?';
    }
  });

  form.addEventListener('submit', async event => {
    event.preventDefault();
    setError('');

    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!validateBaseFields(email, password)) return;
    button.disabled = true;
    button.textContent = authMode === 'create' ? 'Creating...' : 'Logging in...';

    try {
      if (authMode === 'create') {
        await window.ESAuth.createAccount({
          name: '',
          email,
          password,
          // New accounts land on the How It Works walkthrough the first time
          // they confirm their email, not the homepage; every login after
          // that first landing goes through the normal getRedirectTarget()
          // path (index.html by default). The walkthrough now lives on the
          // homepage itself, so this just scrolls straight to it.
          redirectTo: 'index.html#intro',
        });
        passwordInput.value = '';
        button.disabled = false;
        button.textContent = 'Create Account';
        showConfirmation(email);
        return;
      }

      await window.ESAuth.login({ email, password });
      goToApp();
    } catch (error) {
      setError(error.message || 'Unable to log in right now.');
      button.disabled = false;
      button.textContent = authMode === 'create' ? 'Create Account' : 'Login';
    }
  });

  async function bootLoginPage() {
    if (await window.ESAuth?.isValidSession?.()) {
      window.location.replace(getRedirectTarget());
      return;
    }
    const params = new URLSearchParams(window.location.search);
    const requestedMode = params.get('mode');
    const accountDeleted = params.get('account') === 'deleted';
    setMode(
      requestedMode === 'create' || requestedMode === 'login'
        ? requestedMode
        : accountDeleted ? 'create' : 'login'
    );

    if (params.get('confirmation') === 'failed') {
      setError('That link has already been used or has expired. Try logging in first—your account may already be confirmed.');
    } else if (params.get('confirmation') === 'success') {
      setError('Email confirmed. Log in with your password to continue.', 'success');
    } else if (accountDeleted) {
      setError('Your account was deleted. You can create a new account anytime with an approved ES email.', 'success');
    }
  }

  bootLoginPage();
})();
</script>
</body>
