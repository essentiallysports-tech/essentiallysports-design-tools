<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trends | FrameUp</title>
  <meta name="robots" content="noindex">
  <script>
    // Trend Design moved into AI Studio: it is now the Trends view of
    // generate.html. Old links and bookmarks land there with their query
    // (?sport=nfl, ?brief=…) and hash kept. replace() keeps this page out of
    // the Back history. generate.html runs its own sign-in check.
    (() => {
      const query = new URLSearchParams(window.location.search);
      if (!query.has('brief')) query.set('view', 'trends');
      window.location.replace(`generate.html?${query.toString()}${window.location.hash}`);
    })();
  </script>
  <script src="frameup-errors.js?v=20261121-qa-auth-errors"></script>
  <script src="es-auth-config.js?v=20260707-auth4"></script>
  <script src="es-auth.js?v=20261121-qa-auth-errors"></script>
  <script>
    // Fallback guard if the redirect above is blocked: nothing here is
    // private, but signed-out visitors still go through sign-in, and come
    // back to the new Trends address.
    window.ESAuth?.requireAuth(`generate.html?view=trends${window.location.search.replace(/^\?/, '&')}${window.location.hash}`);
  </script>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
  <p style="margin:48px auto;max-width:480px;padding:0 16px;font:15px/1.5 Roboto,sans-serif;color:#33373f">Trend Design is now part of AI Studio. <a href="generate.html?view=trends">Open Trends</a>.</p>
</body>
</html>
