  <script>
    (() => {
      'use strict';
      // Signed-out screen. From the account menu (?from=menu) it signs out
      // straight away (the menu already asked if work was unsaved); opened
      // any other way it asks first. ESAuth.logout() is the same call as
      // before; nothing else about signing out changed.
      const card = document.getElementById('logout-card');
      const title = document.getElementById('logout-title');
      const copy = document.getElementById('logout-copy');
      const actions = document.getElementById('logout-actions');
      const note = document.getElementById('logout-note');
      const icon = document.getElementById('logout-icon');
      const status = document.getElementById('logout-status');
      const fromMenu = new URLSearchParams(window.location.search).get('from') === 'menu';
      const svg = paths => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
      const ICONS = {
        out: svg('<path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>'),
        done: svg('<path d="M20 6 9 17l-5-5"/>'),
        error: svg('<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>'),
        spin: '<span class="acc-out__spinner"></span>',
      };
      const SIGN_IN = '<a class="es-btn es-btn--primary es-btn--lg" href="../login.html" id="sign-back-in">Sign back in</a>';

      function show(state, { heading, text, buttons = '', footnote = '', glyph, focus = true }) {
        card.dataset.state = state;
        icon.innerHTML = glyph;
        title.textContent = heading;
        copy.textContent = text;
        actions.innerHTML = buttons;
        note.textContent = footnote;
        note.hidden = !footnote;
        document.title = `${heading.replace(/…$/, '')} | FrameUp`;
        if (focus) (actions.querySelector('a, button') || title).focus({ preventScroll: true });
      }

      async function signOut() {
        show('working', { heading: 'Signing you out…', text: 'Ending your session on this device.', glyph: ICONS.spin, focus: false });
        status.textContent = 'Signing you out…';
        try {
          await window.ESAuth?.logout?.();
          try {
            sessionStorage.setItem('es.ai.loggedOut', 'true');
            // Edit profile's own copy goes with the rest of the personal details.
            localStorage.removeItem('es.ai.profile.edits.v1');
          } catch (error) { /* ignore */ }
          window.FrameUpProfileMenu?.refresh?.({});
          show('signed-out', {
            heading: 'You’re signed out',
            text: 'Your FrameUp session on this device has ended.',
            buttons: SIGN_IN,
            footnote: 'Your name and email were cleared from this browser. Editor drafts and your theme stay on this device.',
            glyph: ICONS.done,
          });
          status.textContent = 'You’re signed out.';
        } catch (error) {
          show('error', {
            heading: 'Couldn’t finish signing out',
            text: 'The sign-in service didn’t answer. Check your connection and try again.',
            buttons: '<button class="es-btn es-btn--primary es-btn--lg" type="button" data-logout-retry>Try again</button><a class="es-btn es-btn--lg" href="../index.html#frames">Back to FrameUp</a>',
            glyph: ICONS.error,
          });
          status.textContent = 'Signing out failed.';
          actions.querySelector('[data-logout-retry]').addEventListener('click', signOut);
        }
      }

      function askFirst() {
        show('confirm', {
          heading: 'Log out of FrameUp?',
          text: 'This ends your session on this device. Editor drafts stay saved here.',
          buttons: '<button class="es-btn es-btn--primary es-btn--lg" type="button" id="confirm-logout">Log out</button><a class="es-btn es-btn--lg" href="../index.html#frames">Stay signed in</a>',
          glyph: ICONS.out,
        });
        document.getElementById('confirm-logout').addEventListener('click', signOut);
      }

      async function sessionState() {
        try {
          const check = window.ESAuth?.sessionStatus?.();
          if (!check) return 'unknown';
          const result = await Promise.race([check, new Promise(resolve => setTimeout(() => resolve('unknown'), 8000))]);
          return result === 'valid' ? 'signed-in' : result === 'no-session' ? 'signed-out' : 'unknown';
        } catch (error) {
          return 'unknown';
        }
      }

      (async () => {
        const state = await sessionState();
        if (state === 'signed-out') {
          show('already', {
            heading: 'You’re already signed out',
            text: 'There’s no FrameUp session on this device.',
            buttons: SIGN_IN,
            glyph: ICONS.done,
          });
          return;
        }
        if (fromMenu) signOut();
        else askFirst();
      })();
    })();
  </script>
